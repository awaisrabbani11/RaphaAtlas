<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Background Glow / Circle -->
  <defs>
    <radialGradient id="globeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </radialGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B6D45" />
      <stop offset="100%" stop-color="#2D5A27" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Globe Outer Boundary Ring -->
  <circle cx="300" cy="270" r="180" fill="url(#globeGrad)" stroke="#1E293B" stroke-width="8" />

  <!-- Continents & Oceans (Navy & Green Globe Map Pattern) -->
  <!-- Ocean / Water Vector Paths -->
  <path d="M 170 210 Q 200 180 240 190 T 290 230 T 250 310 T 180 330 Z" fill="#1E293B" opacity="0.95" />
  <path d="M 320 150 Q 370 140 420 180 T 440 260 T 380 300 T 310 220 Z" fill="#2D5A27" opacity="0.9" />
  <path d="M 220 330 Q 270 340 310 400 T 280 440 T 210 410 Z" fill="#3B6D45" opacity="0.9" />

  <!-- Latitude & Longitude Arc Grid Lines -->
  <ellipse cx="300" cy="270" rx="180" ry="70" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  <ellipse cx="300" cy="270" rx="180" ry="130" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,6" opacity="0.3" />
  <line x1="300" y1="90" x2="300" y2="450" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Circuit Lines & Microchip Nodes (Gold) extending outwards -->
  <!-- Left Circuit Nodes -->
  <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 120 230 L 165 230 L 195 260" />
    <circle cx="120" cy="230" r="7" fill="#D97706" stroke="#FFFFFF" stroke-width="2" />

    <path d="M 100 280 L 150 280 L 175 300" />
    <circle cx="100" cy="280" r="7" fill="#D97706" stroke="#FFFFFF" stroke-width="2" />

    <path d="M 130 330 L 180 330" />
    <circle cx="130" cy="330" r="7" fill="#D97706" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Right Circuit Nodes -->
  <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 480 230 L 435 230 L 405 200" />
    <circle cx="480" cy="230" r="7" fill="#D97706" stroke="#FFFFFF" stroke-width="2" />

    <path d="M 500 280 L 450 280 L 420 260" />
    <circle cx="500" cy="280" r="7" fill="#D97706" stroke="#FFFFFF" stroke-width="2" />

    <path d="M 470 330 L 420 330" />
    <circle cx="470" cy="330" r="7" fill="#D97706" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Central Medical Staff of Aesculapius / Caduceus with Twin Leaves -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Center Staff Rod -->
    <line x1="300" y1="120" x2="300" y2="430" stroke="#1E293B" stroke-width="10" />

    <!-- Twin Leaves Crown at Top -->
    <path d="M 300 140 Q 260 110 230 135 Q 260 160 300 140 Z" fill="#2D5A27" stroke="#1E293B" stroke-width="3" />
    <path d="M 300 140 Q 340 110 370 135 Q 340 160 300 140 Z" fill="#2D5A27" stroke="#1E293B" stroke-width="3" />
    <circle cx="300" cy="140" r="8" fill="#D97706" />

    <!-- Twin Coiled Serpents around Staff -->
    <path d="M 240 180 C 360 210, 360 250, 240 280 C 360 310, 360 350, 250 380 L 300 420" stroke="#1E293B" stroke-width="12" fill="none" />
    <path d="M 360 180 C 240 210, 240 250, 360 280 C 240 310, 240 350, 350 380 L 300 420" stroke="#2D5A27" stroke-width="8" fill="none" />
  </g>

  <!-- Typography: RAPHAATLAS -->
  <text x="300" y="515" text-anchor="middle" font-family="'Playfair Display', 'Georgia', serif" font-weight="900" font-size="46" letter-spacing="4">
    <tspan fill="#1E293B">RAPHA</tspan><tspan fill="#2D5A27">ATLAS</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="300" y="550" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#475569" letter-spacing="3">
    THE COMPLETE MAP OF HEALING &amp; HEALTH AI
  </text>
</svg>
